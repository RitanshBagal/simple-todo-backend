name: Deploy Todo Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_NAME: todo-backend
  IMAGE_TAG: latest
  CONTAINER_NAME: todo-backend-app

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      # Source code checkout
      - name: Checkout source code
        uses: actions/checkout@v6

      # Setting up Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Build Spring Boot project
      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} \
            .
          echo "Image build success"
          docker images

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          echo "Image push success"
      
      # Deploy on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            set -e

            docker pull ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p 8080:8080 \
              ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

            docker image prune -f
            echo "Deployment successful"
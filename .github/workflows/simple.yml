name: Simple Concept Workflow

on:
  workflow_dispatch:

env:
  APP_NAME: "Todo Backend"
  ENVIRONMENT: "DEVELOPMENT"

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: step1
        run: echo "Hello World from $APP_NAME"

      - name: step2
        run: echo "Hello world2 from $APP_NAME in $ENVIRONMENT"

      - name: step3
        run: echo "Name of the DockerHub username ${{ vars.DOCKERHUB_USERNAME }}"

      - name: step4
        run: echo "Repository name is ${{ github.repository }}"

      - name: step5 checkout
        uses: actions/checkout@v6

      - name: step6 setup java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: printing java version
        run: java -version